services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripcare
      POSTGRES_PASSWORD: tripcare
      POSTGRES_DB: tripcare
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripcare -d tripcare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tripcare-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://tripcare:tripcare@db:5432/tripcare
      JWT_SECRET: local-demo-secret
      QA_BUG_MODE: ${QA_BUG_MODE:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
        VITE_QA_BUG_MODE: ${QA_BUG_MODE:-false}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  tripcare-postgres:
