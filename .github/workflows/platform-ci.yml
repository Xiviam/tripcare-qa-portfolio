name: Platform CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: platform/services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint backend
        working-directory: platform/services/api
        run: python -m ruff check tripcare_api tests
      - name: Test backend
        working-directory: platform/services/api
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: platform/apps/web
        run: npm ci
      - name: Lint web
        working-directory: platform/apps/web
        run: npm run lint
      - name: Typecheck web
        working-directory: platform/apps/web
        run: npm run typecheck
      - name: Unit tests web
        working-directory: platform/apps/web
        run: npm test -- --run
      - name: Build web
        working-directory: platform/apps/web
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        working-directory: platform
        run: docker compose config

