name: Autotests Web

on:
  push:
  pull_request:

concurrency:
  group: autotests-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/apps/web/package-lock.json
            autotests/web-tests/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: autotests
        run: python -m pip install -r ../platform/services/api/requirements-dev.txt -r api-tests/requirements.txt
      - name: Install SUT web
        working-directory: platform/apps/web
        run: npm ci
      - name: Install Playwright tests
        working-directory: autotests/web-tests
        run: npm ci && npx playwright install --with-deps
      - name: Start API
        working-directory: platform/services/api
        run: python -m uvicorn tripcare_api.main:app --host 127.0.0.1 --port 8000 &
      - name: Start web
        working-directory: platform/apps/web
        run: npm run dev -- --host 127.0.0.1 --port 5173 &
      - name: Wait for API
        working-directory: autotests
        run: python scripts/wait_for_health.py
      - name: Run web tests
        working-directory: autotests/web-tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: autotests/web-tests/playwright-report

