name: Autotests API

on:
  push:
  pull_request:

concurrency:
  group: autotests-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: autotests
        run: python -m pip install -r ../platform/services/api/requirements-dev.txt -r api-tests/requirements.txt
      - name: Lint autotests
        working-directory: autotests
        run: python -m ruff check api-tests common scripts
      - name: Run API tests
        working-directory: autotests
        run: python -m pytest api-tests -q --alluredir=allure-results/api
      - name: Count tests
        working-directory: autotests
        run: python scripts/count_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api-results
          path: autotests/allure-results/api

